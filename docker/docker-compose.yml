name: universal-translator-obs

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    ports:
      - "4317:4317"    # OTLP gRPC — host app pushes here
      - "8889:8889"    # Prometheus exporter — prometheus scrapes here
    volumes:
      - ./otelcol/otelcol.yml:/etc/otelcol-contrib/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [obs]

  prometheus:
    image: prom/prometheus:v3.4.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [obs]

  tempo:
    image: grafana/tempo:2.7.2
    ports:
      - "3200:3200"    # HTTP API (Grafana datasource)
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    networks: [obs]

  loki:
    image: grafana/loki:3.4.3
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [obs]

  grafana:
    image: grafana/grafana:11.6.1
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    networks: [obs]

networks:
  obs:

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
