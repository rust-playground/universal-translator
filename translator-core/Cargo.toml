[package]
name    = "translator-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
metal          = ["candle-core/metal", "candle-transformers/metal", "candle-nn/metal", "dep:metal"]
cuda           = ["candle-core/cuda", "candle-transformers/cuda", "candle-nn/cuda", "dep:cudarc", "dep:candle-flash-attn"]
opentelemetry  = ["dep:opentelemetry"]

[dependencies]
candle-core         = { workspace = true }
candle-transformers = { workspace = true }
candle-nn           = { workspace = true }
tokenizers          = { workspace = true }
serde_json          = { workspace = true }
lingua              = { workspace = true }
thiserror           = { workspace = true }
serde               = { workspace = true }
tracing             = { workspace = true }
rand                = { version = "0.8", features = ["small_rng"] }
crossbeam-channel   = "0.5"
rayon               = "1"
opentelemetry       = { workspace = true, optional = true }
metal              = { version = "0.29", optional = true }
cudarc             = { version = "0.19", optional = true, default-features = false, features = ["driver"] }
candle-flash-attn  = { version = "0.9", optional = true }
