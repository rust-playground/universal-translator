[workspace]
members = ["translator-core", "translator-api", "translator-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Fast, fully local text translation CLI and API using MADLAD-400 via Candle"
repository  = "https://github.com/rust-playground/universal-translator"
keywords    = ["translation", "nlp", "madlad", "candle", "lingua"]

[workspace.dependencies]
translator-core     = { path = "./translator-core" }
dirs                = "6"
tokio               = { version = "1" }
thiserror           = "2"
anyhow              = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
candle-core         = { version = "0.9" }
candle-transformers = { version = "0.9" }
candle-nn           = { version = "0.9" }
tokenizers          = { version = "0.22", default-features = false, features = ["onig"] }
lingua              = "1"
clap                = { version = "4", features = ["derive", "env"] }
axum                = { version = "0.8", features = ["json", "macros"] }
tower-http          = { version = "0.6", features = ["trace"] }
