[workspace]
members = ["translator-core", "translator-api", "translator-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.2"
license = "MIT OR Apache-2.0"
description = "Fast, fully local text translation CLI and API using TranslateGemma 4B via llama.cpp"
repository  = "https://github.com/rust-playground/universal-translator"
keywords    = ["translation", "nlp", "gemma", "llama-cpp", "lingua"]

[workspace.dependencies]
translator-core     = { path = "./translator-core" }
dirs                = "6"
tokio               = { version = "1" }
thiserror           = "2"
anyhow              = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
llama-cpp-2         = { version = "0.1", default-features = false }
lingua              = "1"
clap                = { version = "4", features = ["derive", "env"] }
axum                = { version = "0.8", features = ["json", "macros"] }
tower-http          = { version = "0.6", features = ["trace"] }
futures             = { version = "0.3", default-features = false, features = ["async-await", "alloc"] }
opentelemetry          = { version = "0.31" }
opentelemetry_sdk      = { version = "0.31" }
opentelemetry-otlp     = { version = "0.31", features = ["trace", "metrics", "logs", "grpc-tonic"] }
tracing-opentelemetry  = { version = "0.32" }
opentelemetry-appender-tracing = { version = "0.31" }
