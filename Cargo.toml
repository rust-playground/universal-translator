[workspace]
members = ["translator-core", "translator-api", "translator-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Fast, fully local text translation CLI and API using Helsinki-NLP OPUS-MT models"
repository  = "https://github.com/rust-playground/universal-translator"
keywords    = ["translation", "nlp", "opus-mt", "ctranslate2", "lingua"]

[workspace.dependencies]
translator-core = { path = "./translator-core" }
dirs            = "5"
tokio            = { version = "1" }
thiserror        = "2"
anyhow           = "1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ct2rs            = { version = "0.9", features = ["sentencepiece"] }
lingua           = "1"
clap             = { version = "4", features = ["derive"] }
axum             = { version = "0.8", features = ["json", "macros"] }
tower-http       = { version = "0.6", features = ["trace"] }
